[project]
name = "visualisation-performances-sportives"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lx-345", email = "leo.panier55@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "python-dotenv>=1.2.2",
    "s3fs>=2026.7.0",
    "streamlit>=1.60.0",
]

[project.scripts]
visualisation-performances-sportives = "visualisation_performances_sportives:main"
# La NOUVELLE commande pour lancer l'interface web
app = "visualisation_performances_sportives.streamlit_app.app:run"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]


[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["notebooks/"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
markers = [
    "unit: tests unitaires",
    "integration: tests d'integration",
    "e2e: tests end-to-end",
]

[tool.coverage.run]
omit = [
    "src/visualisation_performances_sportives/streamlit_app/app.py",
    "src/visualisation_performances_sportives/streamlit_app/style.py",
]

